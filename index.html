<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mia Alves — Video Editor & Content Producer</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0f0d0c;
  --bg2: #171412;
  --bg3: #201c18;

  --fg: #f3eee6;
  --fgMid: #b8ad9f;
  --fgDim: #6f6458;

  --accent: #c6a36a;
  --accentL: #e3c790;

  --border: rgba(243,238,230,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}

/* GRID */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 12px;
  padding: 120px 60px;
}

.project-card {
  grid-column: span 5;
  background: var(--bg2);
  cursor: pointer;
  transition: transform 0.35s ease;
}

.project-card.featured {
  grid-column: span 7;
}

.project-card:hover {
  transform: translateY(-4px);
}

.img-ph {
  height: 240px;
  background: repeating-linear-gradient(
    45deg,
    #1a1816,
    #1a1816 4px,
    #201c19 4px,
    #201c19 8px
  );
}

.card-info {
  padding: 16px;
  border-top: 1px solid var(--border);
}

.card-title {
  font-family: 'Syne';
  font-size: 14px;
}

/* LIGHTBOX */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.lightbox.open { display: flex; }

.lightbox-content {
  width: 85%;
  max-width: 1000px;
}

.lightbox-frame {
  aspect-ratio: 16/9;
  background: black;
}

.lightbox-frame iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.lightbox-title {
  margin-top: 10px;
  color: var(--fgMid);
  font-size: 12px;
}

.lightbox-close,
.lightbox-nav {
  position: absolute;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--fg);
  padding: 10px 14px;
  cursor: pointer;
}

.lightbox-close { top: 20px; right: 20px; }

.lightbox-nav.left { left: 20px; top: 50%; transform: translateY(-50%); }
.lightbox-nav.right { right: 20px; top: 50%; transform: translateY(-50%); }

@media (max-width: 768px) {
  .project-card,
  .project-card.featured {
    grid-column: span 12;
  }
  .lightbox-nav { display: none; }
}
</style>
</head>

<body>

<section class="projects-grid">

  <div class="project-card featured" data-video="https://www.youtube.com/embed/YDHoT3vU41E">
    <div class="img-ph"></div>
    <div class="card-info"><div class="card-title">Brand Campaign</div></div>
  </div>

  <div class="project-card" data-video="https://www.youtube.com/embed/YDHoT3vU41E">
    <div class="img-ph"></div>
    <div class="card-info"><div class="card-title">TikTok Series</div></div>
  </div>

  <div class="project-card" data-video="https://www.youtube.com/embed/YDHoT3vU41E">
    <div class="img-ph"></div>
    <div class="card-info"><div class="card-title">Reels Package</div></div>
  </div>

</section>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">

  <div class="lightbox-content">

    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-nav left" onclick="prev()">←</button>
    <button class="lightbox-nav right" onclick="next()">→</button>

    <div class="lightbox-frame" id="frame"></div>
    <div class="lightbox-title" id="title"></div>

  </div>

</div>

<script>
const cards = [...document.querySelectorAll('.project-card')];

const projects = cards.map(c => ({
  title: c.innerText,
  video: c.dataset.video
}));

let i = 0;

const lightbox = document.getElementById('lightbox');
const frame = document.getElementById('frame');
const title = document.getElementById('title');

function openLightbox(index){
  i = index;
  render(true);
  lightbox.classList.add('open');
}

function closeLightbox(){
  lightbox.classList.remove('open');
  frame.innerHTML = "";
}

function next(){
  i = (i + 1) % projects.length;
  render(true);
}

function prev(){
  i = (i - 1 + projects.length) % projects.length;
  render(true);
}

function render(autoplay=false){
  const p = projects[i];
  title.innerText = p.title;

  frame.innerHTML = `
    <iframe 
      src="${p.video}?autoplay=${autoplay?1:0}&mute=1" 
      allow="autoplay; encrypted-media" 
      allowfullscreen>
    </iframe>
  `;
}

cards.forEach((c, idx)=>{
  c.addEventListener('click', () => openLightbox(idx));
});

lightbox.addEventListener('click', (e)=>{
  if(e.target === lightbox) closeLightbox();
});

document.addEventListener('keydown', (e)=>{
  if(!lightbox.classList.contains('open')) return;

  if(e.key === 'Escape') closeLightbox();
  if(e.key === 'ArrowRight') next();
  if(e.key === 'ArrowLeft') prev();
});
</script>

</body>
</html>
